<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f6f5f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fuzzies" />
    <meta name="description" content="Fuzzies — design posters, posts, stories, slides and more. Templates, stickers, photo tools, easy sharing, and a fuzzy little game to unlock rewards. Dream it fuzzy. Make it sharp." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link id="fz-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=DM+Sans:ital,wght@1,500&display=swap" media="print" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="./art/fuzzy-hero.webp" />
    <style>
      /* Launch screen: the Fuzzy pops in and bounces, the name glides up, then everything melts into the app. */
      #splash { --sp-bg: #18171c; --sp-ink: #fff; --sp-soft: rgba(255,255,255,.62); --sz: min(56vw, 250px);
        position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 0;
        background: var(--sp-bg); color: var(--sp-ink); overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent;
        transition: opacity .55s cubic-bezier(.4,0,.2,1), visibility 0s linear .55s; }
      #splash.light { --sp-ink: #18171c; --sp-soft: rgba(24,23,28,.58); }
      #splash.out { opacity: 0; visibility: hidden; }
      #splash .sp-glow { position: absolute; width: calc(var(--sz) * 3); aspect-ratio: 1; border-radius: 50%; left: 50%; top: 50%;
        transform: translate(-50%, -62%) scale(.4); opacity: 0;
        background: radial-gradient(closest-side, color-mix(in srgb, var(--sp-c, #ff86bb) 34%, transparent), transparent); }
      #splash .sp-stage { position: relative; width: var(--sz); height: calc(var(--sz) * 1.18); transition: transform .55s cubic-bezier(.4,0,.2,1); }
      #splash.out .sp-stage, #splash.out .sp-text { transform: translateY(-10px) scale(1.04); }
      #splash .sp-jump { position: absolute; left: 0; right: 0; bottom: calc(var(--sz) * .14); height: var(--sz); transform: scale(0); }
      #splash .sp-squash { width: 100%; height: 100%; transform-origin: 50% 100%; }
      #splash .sp-squash { position: relative; }
      #splash .sp-squash img { width: 100%; height: 100%; display: block; -webkit-user-drag: none; user-select: none; }
      #splash .sp-squash img.sp-wink { position: absolute; inset: 0; opacity: 0; transition: opacity 60ms linear; }
      #splash.winking .sp-squash img.sp-wink { opacity: 1; }
      #splash .sp-tilt { width: 100%; height: 100%; transform-origin: 50% 90%; }
      #splash.go .sp-tilt { animation: sp-tilt 1.1s 1.5s cubic-bezier(.45,0,.55,1) forwards, sp-breathe 2.4s 2.6s ease-in-out infinite; }
      @keyframes sp-tilt { 0% { transform: rotate(0); } 30% { transform: rotate(-7deg) scale(1.03); } 62% { transform: rotate(3deg); } 100% { transform: rotate(0); } }
      @keyframes sp-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025, .985); } }
      #splash .sp-shadow { position: absolute; left: 22%; right: 22%; bottom: calc(var(--sz) * .07); height: calc(var(--sz) * .09); border-radius: 50%;
        background: radial-gradient(closest-side, rgba(0,0,0,.5), transparent); opacity: 0; transform: scaleX(.2); }
      #splash.light .sp-shadow { background: radial-gradient(closest-side, rgba(0,0,0,.22), transparent); }
      #splash .sp-star { position: absolute; width: 14px; height: 14px; opacity: 0; color: #ffd84d;
        background: currentColor; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
      #splash .sp-star.s1 { left: -8%; top: 22%; } #splash .sp-star.s2 { right: -6%; top: 8%; width: 18px; height: 18px; }
      #splash .sp-star.s3 { right: -14%; top: 52%; width: 10px; height: 10px; color: #fff; } #splash .sp-star.s4 { left: 4%; top: -4%; width: 9px; height: 9px; color: #fff; }
      #splash .sp-text { text-align: center; transition: transform .55s cubic-bezier(.4,0,.2,1); }
      #splash .sp-word { font: 700 calc(var(--sz) * .36)/1 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif; letter-spacing: -.02em; margin-top: 6px; display: flex; justify-content: center; }
      #splash .sp-word span { display: inline-block; opacity: 0; transform: translateY(18px) scale(.9); filter: blur(6px); }
      #splash .sp-quote { margin-top: 10px; font: italic 500 15px/1.3 'DM Sans', system-ui, sans-serif; color: var(--sp-soft); opacity: 0; transform: translateY(6px); }

      #splash.go .sp-glow { animation: sp-glow 1.6s .15s cubic-bezier(.2,.8,.2,1) forwards; }
      #splash.go .sp-jump { animation: sp-pop .62s cubic-bezier(.2,.9,.25,1.2) forwards, sp-bounce .9s .62s cubic-bezier(.45,0,.55,1) forwards; }
      #splash.go .sp-squash { animation: sp-squash .9s .62s ease-in-out forwards; }
      #splash.go .sp-shadow { animation: sp-shadow-in .62s ease-out forwards, sp-shadow 0.9s .62s cubic-bezier(.45,0,.55,1) forwards; }
      #splash.go .sp-star { animation: sp-twinkle 1.1s cubic-bezier(.3,.7,.4,1) forwards; }
      #splash.go .sp-star.s1 { animation-delay: .5s; } #splash.go .sp-star.s2 { animation-delay: .72s; }
      #splash.go .sp-star.s3 { animation-delay: 1.02s; } #splash.go .sp-star.s4 { animation-delay: 1.2s; }
      #splash.go .sp-word span { animation: sp-letter .62s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(1.02s + var(--i) * 55ms); }
      #splash.go .sp-quote { animation: sp-fade .7s 1.55s cubic-bezier(.2,.8,.2,1) forwards; }

      @keyframes sp-glow { to { opacity: 1; transform: translate(-50%, -62%) scale(1); } }
      @keyframes sp-pop { 0% { transform: translateY(30%) scale(0); } 55% { transform: translateY(-8%) scale(1.12, 1.06); } 78% { transform: translateY(0) scale(.95, 1.04); } 100% { transform: translateY(0) scale(1); } }
      @keyframes sp-bounce { 0%, 100% { transform: translateY(0) scale(1); } 28% { transform: translateY(-26%) scale(1); } 56% { transform: translateY(0) scale(1); } 76% { transform: translateY(-9%) scale(1); } }
      @keyframes sp-squash { 0% { transform: scale(1); } 8% { transform: scale(1.1, .9); } 20% { transform: scale(.95, 1.07); } 34% { transform: scale(1); }
        52% { transform: scale(1); } 58% { transform: scale(1.12, .88); } 68% { transform: scale(.97, 1.04); } 80% { transform: scale(1); }
        92% { transform: scale(1.05, .95); } 100% { transform: scale(1); } }
      @keyframes sp-shadow-in { to { opacity: 1; transform: scaleX(1); } }
      @keyframes sp-shadow { 0%, 56%, 100% { transform: scaleX(1); opacity: 1; } 28% { transform: scaleX(.62); opacity: .45; } 76% { transform: scaleX(.85); opacity: .8; } }
      @keyframes sp-twinkle { 0% { opacity: 0; transform: scale(0) rotate(0); } 35% { opacity: 1; transform: scale(1.25) rotate(60deg); } 100% { opacity: 0; transform: scale(.4) rotate(140deg); } }
      @keyframes sp-letter { to { opacity: 1; transform: none; filter: none; } }
      @keyframes sp-fade { to { opacity: 1; transform: none; } }

      /* calmer version for people who asked their device for less motion */
      #splash.still .sp-jump { animation: sp-fade .5s forwards; transform: none; opacity: 0; }
      #splash.still .sp-shadow, #splash.still .sp-glow { animation: sp-fade .5s forwards; transform: none; }
      #splash.still .sp-squash, #splash.still .sp-star, #splash.still .sp-tilt { animation: none; }
      #splash.still .sp-word span { animation: sp-letter .5s .2s forwards; transform: none; filter: none; }
      #splash.still .sp-quote { animation: sp-fade .5s .3s forwards; }
      #splash .sp-sound { position: absolute; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 16px; border-radius: 99px; font: 600 14px/1 'DM Sans', system-ui, sans-serif; color: var(--sp-ink); background: rgba(255,255,255,.12);
        box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.22); opacity: 0; transform: translate(-50%, 8px); transition: opacity .35s, transform .35s; pointer-events: none; }
      #splash.light .sp-sound { background: rgba(24,23,28,.06); box-shadow: inset 0 0 0 1.5px rgba(24,23,28,.14); }
      #splash .sp-sound.on { opacity: 1; transform: translate(-50%, 0); }
      #splash .sp-sound.on svg { animation: sp-ring 1.2s ease-in-out infinite; }
      @keyframes sp-ring { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(-12deg); } 30% { transform: rotate(10deg); } 45% { transform: rotate(0); } }
    </style>
    <title>Fuzzies — Dream it fuzzy. Make it sharp.</title>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-glow"></div>
      <div class="sp-stage">
        <span class="sp-star s1"></span><span class="sp-star s2"></span><span class="sp-star s3"></span><span class="sp-star s4"></span>
        <div class="sp-shadow"></div>
        <div class="sp-jump"><div class="sp-squash"><div class="sp-tilt"><img id="sp-img" src="./art/fuzzy-hero.webp" alt="" /><img class="sp-wink" src="./art/fuzzy-hero-wink.webp" alt="" /></div></div></div>
      </div>
      <div class="sp-text">
        <div class="sp-word"><span style="--i:0">f</span><span style="--i:1">u</span><span style="--i:2">z</span><span style="--i:3">z</span><span style="--i:4">i</span><span style="--i:5">e</span><span style="--i:6">s</span></div>
        <div class="sp-quote">Dream it fuzzy. Make it sharp.</div>
      </div>
    </div>
    <script src="/splash.js"></script>
    <div id="app">
      <div class="boot">
        <div class="boot-word">fuzzies</div>
        <div class="boot-quote">Dream it fuzzy. Make it sharp.</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
